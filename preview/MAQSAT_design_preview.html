function goalsPage(){return `${header('Цели','Большое становится достижимым, когда видно следующий шаг.',openBtn('＋ Новая цель','goal'),'ПРОГРЕСС И СМЫСЛ')}<div class="grid-two">${state.goals.map(g=>`<section class="panel panel-body"><div class="compact-link" style="margin-bottom:20px">${icon('◎','purple')}<span class="pill violet">${esc(g.area)}</span></div><div style="font-size:17px;font-weight:780;margin-bottom:8px">${esc(g.name)}</div><p class="helptext">${esc(g.detail)}</p><div class="goal-top" style="margin-top:17px"><span class="muted text-sm">Общий прогресс</span><b>${g.progress}%</b></div><div class="progress"><div class="progress-fill" style="width:${g.progress}%"></div></div><div class="onboarding-line"><span class="text-sm">Следующий шаг</span><button class="soft-link" data-open="task">＋ Задача</button></div></section>`).join('')}${panel('Life Map',`<div style="text-align:center;padding:4px 0 17px"><div class="pill violet" style="padding:11px 20px;font-size:13px">◎ Большая цель</div><div style="font-size:21px;color:var(--muted2)">↓</div><div class="grid-two" style="gap:9px"><div class="onboarding-line">▣ Проекты</div><div class="onboarding-line">☑ Задачи</div><div class="onboarding-line">▦ Календарь</div><div class="onboarding-line">◈ Финансы</div></div><div style="font-size:21px;color:var(--muted2)">↓</div><div class="pill green">▥ Прогресс и аналитика</div></div>`)} </div>`;}
function workPage(){return `${header('Работа','Проекты, время, дедлайны и отдельный учёт заработка.',openBtn('＋ Проект','project'),'ПРОЕКТЫ И ЗАРАБОТОК')}<div class="grid-three">${state.projects.map(p=>`<section class="panel panel-body"><div>${icon('▣','blue')}</div><div style="font-weight:760;font-size:15px;margin-top:13px">${esc(p.title)}</div><p class="tiny muted">${esc(p.area)} · ${p.hours} ч работы</p><div class="progress" style="margin-top:20px"><div class="progress-fill" style="width:${p.progress}%"></div></div><div class="goal-top" style="margin-top:7px"><span class="tiny muted">Готовность</span><b class="text-sm">${p.progress}%</b></div></section>`).join('')}</div><div class="grid-two" style="margin-top:17px">${panel('Трекер рабочего времени',`<div class="metric">27 ч</div><p class="helptext">Демонстрационный итог по проектам. В полной версии старт/стоп сессий, учёт ставки и отчёты по клиентам.</p><button data-page="focus" class="btn primary">▶ Начать Focus Mode</button>`)}${panel('Доходы и ожидаемые выплаты',`<p class="helptext">Почасовая ставка × записанное время = расчёт ожидаемого заработка. В финансовом балансе деньги появятся только после отдельного подтверждения фактической оплаты.</p>`)}</div>`;}
function healthPage(){const tab=state.healthTab;return `${header('Здоровье','Движение, питание, сон и восстановление — без гонки за цифрами.','','ЗАБОТА О СЕБЕ')}<div class="segment" style="margin-bottom:16px">${[['workouts','Тренировки'],['nutrition','Питание'],['sleep','Сон']].map(([v,l])=>`<button data-health-tab="${v}" class="${v===tab?'selected':''}">${l}</button>`).join('')}</div>${tab==='workouts'?`<div class="grid-two">${panel('Тренировка · журнал подходов',`<div class="compact-link" style="margin-bottom:10px">${icon('⌁','mint')}<div><div class="list-title">Жим лёжа</div><div class="list-description">Силовая тренировка · демонстрация</div></div></div><div style="display:grid;grid-template-columns:30px 1fr 1fr 50px;gap:9px;color:var(--muted);font-size:10px;text-align:center;margin-bottom:10px"><span>№</span><span>Кг</span><span>Повт.</span><span>Готово</span></div>${state.workoutSets.map((s,i)=>`<div style="display:grid;grid-template-columns:30px 1fr 1fr 50px;gap:9px;align-items:center;margin-bottom:8px"><span style="text-align:center">${i+1}</span><input aria-label="Вес ${i+1}" class="workout-field" data-workout-input="${s.id}:weight" value="${esc(s.weight)}" inputmode="decimal" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);min-width:0;width:100%;text-align:center"><input aria-label="Повторения ${i+1}" data-workout-input="${s.id}:reps" value="${esc(s.reps)}" inputmode="numeric" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);min-width:0;width:100%;text-align:center"><button class="task-check ${s.done?'checked':''}" data-workout-check="${s.id}" style="margin:auto">${s.done?'✓':''}</button></div>`).join('')}<div class="progress" style="margin-top:15px"><div class="progress-fill green" style="width:${Math.round(state.workoutSets.filter(s=>s.done).length/state.workoutSets.length*100)}%"></div></div><div style="margin-top:15px">${btn('＋ Добавить подход','add-set','mini')}</div>`)}${panel('Программа и восстановление',`<div class="list-line"><span>Понедельник</span><span class="tag">Верх тела</span></div><div class="list-line"><span>Среда</span><span class="tag">Спина и руки</span></div><div class="list-line"><span>Пятница</span><span class="tag">Ноги</span></div><p class="helptext">Завершённая тренировка может обновлять календарь и связанную цель. Между занятиями важны отдых и восстановление.</p>`)}</div>`:tab==='nutrition'?`<div class="grid-two">${panel('Дневник питания',`<div class="pill violet" style="margin-bottom:10px">Необязательный учёт</div>${state.meals.map(m=>`<div class="list-line"><div><div class="list-title">${esc(m.name)}</div><div class="list-description">${esc(m.detail)}</div></div><span class="tag">Записано</span></div>`).join('')}<p class="helptext">Можно добавлять продукты, рецепты, порции и ориентировочную энергетическую ценность. Никаких обязательных дневных лимитов и оценок «плохой еды».</p>`)}${panel('База продуктов',`<p class="helptext">В будущем — поиск продукта, штрихкод, собственные блюда и возможность исправить данные. Значения будут приблизительными и должны содержать ссылку на источник.</p>`)}</div>`:`<div class="grid-two">${panel('Сон',`<div class="metric">Дневник сна</div><p class="helptext">Здесь можно записывать продолжительность сна и собственную оценку самочувствия. Значение на карточке — просто пример диапазона, не личная норма.</p>`)}${panel('Восстановление',`<p class="helptext">Необязательные заметки о самочувствии, отдыхе и уровне энергии без публичных рейтингов или соревнований по показателям здоровья.</p>`)}</div>`}`;}
function habitsPage(){return `${header('Привычки','Небольшие действия важнее идеальной серии дней.','','ПОВТОРЯЮЩИЕСЯ ДЕЙСТВИЯ')}<div class="grid-two">${panel('На этой неделе',`<div style="display:flex;justify-content:flex-end;gap:5px;margin-bottom:5px">${['П','В','С','Ч','П','С','В'].map(d=>`<span style="width:26px;text-align:center;font-size:10px;color:var(--muted)">${d}</span>`).join('')}</div>${state.habits.map(h=>`<div class="habit-row"><span style="font-size:20px">${h.icon}</span><div class="list-title">${esc(h.name)}</div><div class="habit-week">${h.days.map((v,i)=>`<button class="habit-day ${v?'hit':''}" data-habit="${h.id}:${i}" title="Переключить отметку">${v?'✓':'·'}</button>`).join('')}</div></div>`).join('')}`)}${panel('Как мы будем мотивировать',`<p class="helptext">Без штрафов и потери всех достижений из-за одного пропуска. Гибкие ритмы (каждый день или несколько раз в неделю), мягкие напоминания и отметки личного прогресса.</p>`)}</div>`;}
function analyticsPage(){const bars=[42,63,36,82,53,91,67],max=100;return `${header('Аналитика','Увидеть прогресс, закономерности и свой баланс.','','ОБЗОР ДАННЫХ')}<div class="stats-grid">${stat('Задачи',Math.round(doneCount()/Math.max(1,state.tasks.length)*100)+'%','Доля выполненных в демо','☑','purple')}${stat('Фокус',Math.floor(state.focusTotal/60)+' ч','Время концентрации','◷','mint')}${stat('Проекты',state.projects.length,'В работе','▣','blue')}${stat('Цели',state.goals.length,'В процессе','◎','orange')}</div><div class="grid-two">${panel('Ритм недели',`<p class="helptext" style="margin-top:0">Пример распределения завершённых активностей. Это иллюстративная статистика.</p><div class="bar-chart">${bars.map((n,i)=>`<div class="bar-col"><div class="bar" style="height:${n/max*91}%"></div><label>${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][i]}</label></div>`).join('')}</div>`)}${panel('Связь между сферами',`<div class="list-plain"><div class="list-line"><span>☑ Задачи</span><span class="pill violet">Выполнение</span></div><div class="list-line"><span>◎ Цели</span><span class="pill green">Прогресс</span></div><div class="list-line"><span>◈ Финансы</span><span class="pill amber">Траты и доходы</span></div><div class="list-line"><span>♡ Здоровье</span><span class="pill">Личная динамика</span></div><div class="list-line"><span>◷ Фокус</span><span class="pill">Время по проектам</span></div></div><p class="helptext">Сюда будут попадать только данные текущего пользователя или тех пространств, к которым он имеет разрешённый доступ.</p>`)}</div>`;}
function settingsPage(){return `${header('Настройки','Персонализация, безопасность, приватность и экспорт данных.','','УПРАВЛЕНИЕ ПРОФИЛЕМ')}<div class="grid-two">${panel('Внешний вид',`<div class="list-line"><div><div class="list-title">Тема приложения</div><div class="list-description">Светлая и тёмная</div></div>${btn('◐ Переключить','theme','mini')}</div><div class="list-line"><span>Анимации</span><span class="tag">С учётом системных настроек</span></div>`)}${panel('Защита данных · в реальном продукте',`<p class="helptext">В демо нет настоящих аккаунтов и защищённого хранилища. В серверной версии будут отдельные пользовательские данные, безопасные сессии, восстановление доступа, журнал операций, экспорт и удаление аккаунта.</p><span class="pill amber">В прототипе не реализовано</span>`)}</div>`;}
function render(){navRender();const screens={dashboard,tasks:tasksPage,ideas:ideasPage,planner:plannerPage,focus:focusPage,finance:financePage,goals:goalsPage,work:workPage,health:healthPage,habits:habitsPage,analytics:analyticsPage,settings:settingsPage};document.getElementById('view').innerHTML=(screens[state.page]||dashboard)()+`<div class="demo-note">MAQSAT — интерактивный UX-прототип. Все суммы, графики, расписания и прогресс — примерные данные. Здесь нет настоящего входа, соединения с PostgreSQL или безопасного хранения данных. Изменения сбрасываются при обновлении страницы.</div>`;}
let timerHandle=null;function syncTimer(){let el=document.getElementById('timertext');if(el)el.textContent=String(Math.floor(state.focusLeft/60)).padStart(2,'0')+':'+String(state.focusLeft%60).padStart(2,'0');}function toggleFocus(){if(state.focusRunning){state.focusRunning=false;clearInterval(timerHandle);timerHandle=null;render();toast('Сессия приостановлена');return;}state.focusRunning=true;timerHandle=setInterval(()=>{if(state.focusLeft>0){state.focusLeft--;syncTimer();}else{clearInterval(timerHandle);timerHandle=null;state.focusRunning=false;state.focusLeft=1500;state.focusTotal+=25;render();toast('Фокус-сессия завершена ✨');}},1000);render();}function resetFocus(){state.focusRunning=false;clearInterval(timerHandle);timerHandle=null;state.focusLeft=1500;render();}
let toastHandle=null;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toastHandle);toastHandle=setTimeout(()=>el.classList.add('hidden'),2800);}
function celebrate(elem){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const r=elem.getBoundingClientRect();const x=r.left+r.width/2,y=r.top+r.height/2;for(let i=0;i<18;i++){let p=document.createElement('i');p.className='confetti-piece';p.style.left=x+'px';p.style.top=y+'px';p.style.background=['#9d7bf4','#4ed7b5','#ffc77b','#ff96c5','#a6c0ff'][i%5];const a=(Math.PI*2*i/18),dist=32+Math.random()*60;p.style.setProperty('--x',(Math.cos(a)*dist)+'px');p.style.setProperty('--y',(Math.sin(a)*dist+20)+'px');p.style.setProperty('--r',Math.round(Math.random()*500)+'deg');document.body.appendChild(p);setTimeout(()=>p.remove(),950);}}
function navigate(page){state.page=page;document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'});}
function modalFields(type){if(type==='task')return `<div class="form-field"><label>Что нужно сделать?</label><input name="title" required maxlength="140" autofocus placeholder="Например: закончить страницу проекта"></div><div class="form-field"><label>Сфера жизни</label><select name="area"><option>Личное</option><option>Работа</option><option>Учёба</option><option>Здоровье</option><option>Финансы</option></select></div>`;
 if(type==='idea')return `<div class="form-field"><label>Твоя идея</label><textarea name="title" required maxlength="500" placeholder="Запиши, пока не забыл..."></textarea></div>`;
 if(type==='event')return `<div class="form-field"><label>Название события</label><input name="title" required maxlength="120" placeholder="Например: встреча"></div><div class="form-field"><label>День недели</label><select name="day"><option value="0">Понедельник</option><option value="1">Вторник</option><option value="2">Среда</option><option value="3">Четверг</option><option value="4">Пятница</option><option value="5">Суббота</option><option value="6">Воскресенье</option></select></div><div class="form-field"><label>Время</label><input name="time" type="time" required value="12:00"></div>`;
 if(type==='expense'||type==='income')return `<div class="form-field"><label>Описание</label><input name="title" required maxlength="120" placeholder="Например: оплата проекта"></div><div class="form-field"><label>Сумма, ₸</label><input name="amount" type="number" min="0.01" max="1000000000" step="0.01" required placeholder="10000"></div><div class="form-field"><label>Категория</label><input name="area" maxlength="60" placeholder="Другое"></div>`;
 if(type==='goal')return `<div class="form-field"><label>Название цели</label><input name="title" required maxlength="120" placeholder="Например: закончить свой проект"></div><div class="form-field"><label>Сфера</label><select name="area"><option>Личное</option><option>Работа</option><option>Развитие</option><option>Финансы</option><option>Здоровье</option></select></div>`;
 if(type==='project')return `<div class="form-field"><label>Название проекта</label><input name="title" required maxlength="120" placeholder="Например: новый сайт"></div><div class="form-field"><label>Направление</label><input name="area" maxlength="70" placeholder="Разработка"></div>`;
 return '';
}
const modalTypes={task:['Новая задача','Добавить в список дел'],idea:['Сохранить идею','Не теряй хорошие мысли'],event:['Новое событие','Добавить в недельный календарь'],expense:['Новый расход','Записать фактическую трату'],income:['Новый доход','Записать полученные деньги'],goal:['Новая цель','Начни с понятного результата'],project:['Новый проект','Собери работу в одном месте']};
function openModal(type){const [title,sub]=modalTypes[type]||modalTypes.task;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-modal-shade="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div style="display:flex;align-items:center;justify-content:space-between"><div><h2>${title}</h2><div class="modal-hint">${sub}</div></div><button class="icon-btn" data-action="close-modal" aria-label="Закрыть">×</button></div><form id="quick-form" data-type="${type}">${modalFields(type)}<div class="modal-actions">${btn('Отмена','close-modal') }<button type="submit" class="btn primary">＋ Добавить</button></div></form></div></div>`;setTimeout(()=>{let f=document.querySelector('#quick-form input,#quick-form textarea');if(f)f.focus()},30);}
function closeModal(){document.getElementById('modal-root').innerHTML='';}
function saveModal(form){const type=form.dataset.type,data=new FormData(form),title=String(data.get('title')||'').trim(),area=String(data.get('area')||'').trim();if(!title){toast('Заполни название');return;}if(type==='task')state.tasks.unshift({id:makeId(),title,area:area||'Личное',due:'Без даты',priority:'Обычный',done:false});else if(type==='idea')state.ideas.unshift({id:makeId(),text:title,created:'Только что'});else if(type==='event')state.events.push({id:makeId(),title,day:Number(data.get('day')),time:String(data.get('time')||'12:00'),area:'Личное'});else if(type==='expense'||type==='income'){const amount=Number(data.get('amount'));if(!Number.isFinite(amount)||amount<=0){toast('Нужна корректная сумма');return;}state.transactions.unshift({id:makeId(),name:title,category:area||'Другое',kind:type,amount,date:'Только что',newEntry:true});}else if(type==='goal')state.goals.unshift({id:makeId(),name:title,progress:0,detail:'Цель создана · добавь первый шаг',area:area||'Личное'});else if(type==='project')state.projects.unshift({id:makeId(),title,progress:0,area:area||'Другое',hours:0});closeModal();render();toast('Добавлено в MAQSAT ✨');}
document.addEventListener('click',e=>{const n=e.target.closest('[data-page]');if(n){navigate(n.dataset.page);return;}const mo=e.target.closest('[data-open]');if(mo){openModal(mo.dataset.open);return;}const tk=e.target.closest('[data-toggle-task]');if(tk){const t=state.tasks.find(x=>x.id===tk.dataset.toggleTask);if(t){t.done=!t.done;if(t.done){celebrate(tk);toast('Задача выполнена. Отличный шаг! ✨');}setTimeout(render,Math.max(0,t.done?180:0));}return;}const convert=e.target.closest('[data-convert-idea]');if(convert){const i=state.ideas.findIndex(x=>x.id===convert.dataset.convertIdea);if(i>=0){let x=state.ideas.splice(i,1)[0];state.tasks.unshift({id:makeId(),title:x.text,area:'Личное',due:'Без даты',priority:'Обычный',done:false});render();toast('Идея стала задачей ✨');}return;}const remove=e.target.closest('[data-remove-idea]');if(remove){state.ideas=state.ideas.filter(x=>x.id!==remove.dataset.removeIdea);render();toast('Идея удалена');return;}const filter=e.target.closest('[data-task-filter]');if(filter){state.taskFilter=filter.dataset.taskFilter;render();return;}const ft=e.target.closest('[data-finance-tab]');if(ft){state.financeTab=ft.dataset.financeTab;render();return;}const ht=e.target.closest('[data-health-tab]');if(ht){state.healthTab=ht.dataset.healthTab;render();return;}const hb=e.target.closest('[data-habit]');if(hb){const [id,num]=hb.dataset.habit.split(':'),h=state.habits.find(x=>x.id===id);if(h){h.days[Number(num)]=h.days[Number(num)]?0:1;render();}return;}const wc=e.target.closest('[data-workout-check]');if(wc){const s=state.workoutSets.find(x=>x.id===wc.dataset.workoutCheck);if(s){s.done=!s.done;if(s.done){celebrate(wc);toast('Подход отмечен!');}setTimeout(render,s.done?170:0);}return;}if(e.target.hasAttribute('data-modal-shade')){closeModal();return;}const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case 'menu':document.getElementById('sidebar').classList.toggle('open');document.getElementById('shade').classList.toggle('open');break;case 'theme':state.theme=state.theme==='dark'?'light':'dark';document.body.classList.toggle('light',state.theme==='light');break;case 'quick':openModal('task');break;case 'close-modal':closeModal();break;case 'focus-play':toggleFocus();break;case 'focus-reset':resetFocus();break;case 'add-set':state.workoutSets.push({id:makeId(),weight:'',reps:'',done:false});render();break;}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-workout-input]')){const [id,key]=el.dataset.workoutInput.split(':'),s=state.workoutSets.find(x=>x.id===id);if(s)s[key]=el.value.slice(0,9);}});
document.addEventListener('submit',e=>{if(e.target.id==='quick-form'){e.preventDefault();saveModal(e.target);}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openModal('task');}if(e.key==='Escape')closeModal();});
document.getElementById('shade').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('open')});
render();
</script>
</body>
</html>
